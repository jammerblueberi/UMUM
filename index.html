<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elysium Archive | Zoom Enabled</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --elysia-main: #ffccd5;
            --elysia-light: #fff0f3;
            --elysia-accent: #ff8fa3;
            --crystal-blue: #caf0f8;
            --text-dark: #495057;
            --glass-white: rgba(255, 255, 255, 0.7);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            background-color: var(--elysia-light);
            background-image: 
                radial-gradient(at 0% 0%, var(--elysia-main) 0px, transparent 50%),
                radial-gradient(at 100% 100%, var(--crystal-blue) 0px, transparent 50%);
            color: var(--text-dark); min-height: 100vh;
            background-attachment: fixed;
        }

        .marquee-box {
            background: var(--glass-white); border-bottom: 2px solid var(--elysia-main); 
            padding: 10px 0; overflow: hidden; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px);
        }
        .marquee-inner {
            display: inline-block; white-space: nowrap; animation: scroll 20s linear infinite;
            font-weight: 800; color: var(--elysia-accent); font-size: 0.8rem;
        }
        @keyframes scroll { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }

        .container { max-width: 1200px; margin: auto; padding: 20px; text-align: center; }
        header h1 { font-size: 2.8rem; font-weight: 800; margin-top: 20px; color: var(--elysia-accent); }

        .section { display: none; flex-direction: column; align-items: center; min-height: 60vh; justify-content: center; animation: softIn 0.5s ease; }
        .active { display: flex; }
        @keyframes softIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; width: 100%; margin-top: 30px; }
        
        .card-btn {
            background: var(--glass-white); border: 2px solid white; padding: 40px 20px;
            border-radius: 30px; cursor: pointer; transition: 0.4s; font-weight: 800;
        }
        .card-btn:hover { border-color: var(--elysia-accent); transform: translateY(-5px); background: white; }

        /* GRID HORIZONTAL */
        .task-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); 
            gap: 25px; margin-top: 30px; text-align: left; width: 100%;
        }

        .item { 
            background: white; border-radius: 30px; overflow: hidden; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); transition: 0.3s;
            display: flex; flex-direction: column;
        }

        .media-box { position: relative; height: 220px; background: #000; overflow: hidden; }
        .media-item { width: 100%; height: 100%; object-fit: cover; display: none; border: none; cursor: zoom-in; }
        .media-item.active { display: block; }
        
        /* Navigasi Gambar di Card */
        .nav-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(255,255,255,0.8); border: none; width: 30px; height: 30px;
            border-radius: 50%; cursor: pointer; z-index: 10; font-weight: bold; color: var(--elysia-accent);
        }

        .info { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .date-badge { background: var(--elysia-main); color: var(--elysia-accent); padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 800; align-self: flex-start; }
        .btn-link { display: block; width: 100%; padding: 12px; margin-top: 15px; border-radius: 15px; text-align: center; font-weight: 800; text-decoration: none; font-size: 0.8rem; background: var(--elysia-accent); color: white; }

        /* FITUR ZOOM (LIGHTBOX) */
        #zoom-modal {
            position: fixed; inset: 0; background: rgba(255, 240, 243, 0.9);
            backdrop-filter: blur(10px); display: none; z-index: 9999;
            align-items: center; justify-content: center; cursor: zoom-out;
        }
        #zoom-modal img { max-width: 90%; max-height: 90vh; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.15); }

        .f-box { position: fixed; bottom: 30px; right: 30px; display: flex; flex-direction: column; gap: 12px; z-index: 1000; }
        .circle { width: 60px; height: 60px; border-radius: 25px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .m-btn { background: var(--crystal-blue); color: #0077b6; }
        .c-btn { background: var(--elysia-main); color: var(--elysia-accent); }
        .back-btn { margin-top: 30px; color: var(--elysia-accent); cursor: pointer; font-weight: 800; text-decoration: underline; }
    </style>
</head>
<body onclick="playMusic()">

<div class="marquee-box">
    <div class="marquee-inner">HI~♪ CLICK ANY IMAGE TO ZOOM • ELYSIUM REALM v2.2 • EVERYTHING IS BETTER IN FULLSCREEN • ♪♪♪</div>
</div>

<div class="container">
    <header><h1>Elysium<span>Archive</span></h1></header>

    <div id="step-1" class="section active">
        <div class="grid">
            <div class="card-btn" onclick="goStep(2, 'PPKN')">⚖️ PPKN</div>
            <div class="card-btn" onclick="goStep(2, 'Pendidikan Agama Kristen')">🙏 Agama</div>
            <div class="card-btn" onclick="goStep(2, 'Penjas')">🏃 Penjas</div>
            <div class="card-btn" onclick="goStep(2, 'Informatika')">💻 Informatika</div>
            <div class="card-btn" onclick="goStep(2, 'Bimbingan Konseling')">🎨 BK</div>
            <div class="card-btn" onclick="goStep(2, 'Matematika')">📊 Matematika</div>
        </div>
    </div>

    <div id="step-2" class="section">
        <h3 id="subject-label" style="color: var(--elysia-accent); font-size: 2rem;">Subject</h3>
        <div class="grid">
            <div class="card-btn" onclick="render('1')">🌸 Semester 1</div>
            <div class="card-btn" onclick="render('2')">🌸 Semester 2</div>
        </div>
        <div class="back-btn" onclick="goStep(1)">← BACK</div>
    </div>

    <div id="step-3" class="section">
        <div class="task-grid" id="mainGrid"></div>
        <div class="back-btn" onclick="goStep(2)" style="margin-top:50px;">← CHANGE SEMESTER</div>
    </div>
</div>

<div id="zoom-modal" onclick="this.style.display='none'">
    <img id="zoom-img" src="" alt="Zoomed View">
</div>

<div class="f-box">
    <button class="circle m-btn" onclick="toggleMute()" id="m-icon">🔊</button>
</div>

<audio id="bgm" loop src="UMUM.mp3"></audio>

<script>
    let state = { m: '', s: '' };
    let musicStarted = false;
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS7DxuxYJLZn2cYV290RNxneB7PcFLo_ECojemQonlBqjHSXl2HAWc4PEEh_c6mhvTbCNn4p2cUX-nD/pub?output=csv';

    function playMusic() {
        if(!musicStarted) {
            const a = document.getElementById('bgm');
            a.volume = 0.05; a.play().catch(()=>{}); musicStarted = true;
        }
    }

    function toggleMute() {
        const a = document.getElementById('bgm');
        a.muted = !a.muted;
        document.getElementById('m-icon').innerText = a.muted ? "🔇" : "🔊";
    }

    function goStep(n, val) {
        if(val) { state.m = val; document.getElementById('subject-label').innerText = val; }
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById('step-'+n).classList.add('active');
        window.scrollTo(0,0);
    }

    // Fungsi Zoom
    function openZoom(src) {
        const modal = document.getElementById('zoom-modal');
        const img = document.getElementById('zoom-img');
        img.src = src;
        modal.style.display = 'flex';
    }

    function render(sem) {
        state.s = sem;
        goStep(3);
        const g = document.getElementById('mainGrid');
        g.innerHTML = '<p style="grid-column: 1/-1; text-align:center;">Syncing memories... ♪</p>';

        Papa.parse(csvUrl, {
            download: true, header: true,
            complete: (res) => {
                const data = res.data.filter(r => r.Mapel == state.m && r.Semester == sem);
                g.innerHTML = data.length ? '' : '<p style="grid-column: 1/-1; text-align:center;">No records found. ♪</p>';

                data.forEach((row, i) => {
                    const links = row['URL Foto'] ? row['URL Foto'].split(',').map(u => u.trim()) : [];
                    let mediaHTML = '';

                    links.forEach((url, idx) => {
                        const active = idx === 0 ? 'active' : '';
                        // Cek apakah file adalah gambar untuk fitur zoom
                        const isImg = url.match(/\.(jpeg|jpg|gif|png|webp)$/i) || !url.includes('drive.google.com');
                        
                        if (url.includes('drive.google.com')) {
                            let id = url.split('/d/')[1]?.split('/')[0] || url.split('id=')[1];
                            mediaHTML += `<iframe class="media-item ${active}" src="https://drive.google.com/file/d/${id}/preview"></iframe>`;
                        } else {
                            mediaHTML += `<img class="media-item ${active}" src="${url}" onclick="openZoom('${url}')">`;
                        }
                    });

                    let desc = row.Deskripsi || '';
                    let pdfBtn = '';
                    const linkMatch = desc.match(/https?:\/\/[^\s]+/);
                    if(linkMatch) {
                        pdfBtn = `<a href="${linkMatch[0]}" target="_blank" class="btn-link">📄 VIEW FILE</a>`;
                        desc = desc.replace(linkMatch[0], '');
                    }

                    g.innerHTML += `
                        <div class="item">
                            <div class="media-box" id="box-${i}">
                                ${mediaHTML}
                                ${links.length > 1 ? `
                                    <button class="nav-btn" style="left:10px" onclick="changeM(${i},-1)">❮</button>
                                    <button class="nav-btn" style="right:10px" onclick="changeM(${i},1)">❯</button>
                                ` : ''}
                            </div>
                            <div class="info">
                                <div>
                                    <span class="date-badge">${row.Tanggal || 'Memory'}</span>
                                    <h3 style="margin:12px 0 8px; font-size:1.1rem;">${row['Nama Tugas']}</h3>
                                    <p style="font-size:0.85rem; color:#777; line-height:1.5;">${desc}</p>
                                </div>
                                ${pdfBtn}
                            </div>
                        </div>`;
                });
            }
        });
    }

    function changeM(id, dir) {
        const items = document.getElementById(`box-${id}`).querySelectorAll('.media-item');
        let cur = Array.from(items).findIndex(m => m.classList.contains('active'));
        items[cur].classList.remove('active');
        let next = (cur + dir + items.length) % items.length;
        items[next].classList.add('active');
    }
</script>
</body>
</html>
